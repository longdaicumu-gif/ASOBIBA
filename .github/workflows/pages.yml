name: Deploy hbd to GitHub Pages

# apps/hbd（ハピバメーカー）を GitHub Pages に公開する。
# 初回実行時に enablement: true で Pages を自動で有効化するので、
# リポジトリの Settings を手動で触る必要はない。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # サイトのルートをハピバメーカーにする（公開URLをキレイに保つ）
          path: ./apps/hbd
      - id: deployment
        uses: actions/deploy-pages@v4
