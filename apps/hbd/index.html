<style>
  :root{
    --bg:#0f1020; --card:#181a2e; --card2:#20233c; --ink:#f2f0ff; --sub:#a49fca;
    --line:#2c2f4d; --accent:#ff5d8f; --gold:#ffcf5c; --ok:#2fbf71;
    --shadow:0 18px 44px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
    color:var(--ink); background:radial-gradient(1200px 600px at 50% -10%, #23244a 0%, #0f1020 60%);
    min-height:100vh; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:520px; margin:0 auto; padding:14px 14px 46px;}
  header.hero{text-align:center; padding:12px 6px 4px;}
  header.hero .logo{font-size:27px; font-weight:800; letter-spacing:.3px;}
  header.hero .logo b{background:linear-gradient(90deg,var(--gold),#ff9de2,#8ab6ff); -webkit-background-clip:text; background-clip:text; color:transparent;}
  header.hero .tag{color:var(--sub); font-size:12.5px; margin-top:5px; line-height:1.5;}

  .card{background:linear-gradient(180deg,var(--card),var(--card2)); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:14px; margin-top:13px;}

  .preview-wrap{position:relative; border-radius:16px; overflow:hidden; background:#000; aspect-ratio:1/1; box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);}
  #preview{width:100%; height:100%; display:block;}

  .seg{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:12px;}
  .seg .chip{border:1.5px solid var(--line); background:#141631; color:var(--ink); padding:9px 4px; border-radius:13px; font-size:12.5px; font-weight:700; cursor:pointer; transition:.15s; text-align:center;}
  .seg .chip .em{display:block; font-size:17px; line-height:1.3;}
  .seg .chip.active{border-color:transparent; background:linear-gradient(135deg,#ff5d8f,#ff9a5a); color:#fff; box-shadow:0 6px 16px rgba(255,93,143,.35);}

  label.fld{display:block; margin-top:12px;}
  label.fld .lb{font-size:11.5px; color:var(--sub); font-weight:700; margin-bottom:5px; display:block; letter-spacing:.03em;}
  input[type=text], textarea{
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px;
    font-size:16px; font-family:inherit; color:var(--ink); background:#12142c; resize:vertical;
  }
  input:focus, textarea:focus{outline:none; border-color:var(--accent);}
  textarea{min-height:62px; line-height:1.5;}

  .chat{margin-top:6px;}
  .chat .h{font-weight:800; font-size:13.5px; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .chatlog{max-height:180px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:4px 2px;}
  .msg{max-width:86%; padding:9px 12px; border-radius:14px; font-size:13.5px; line-height:1.45; white-space:pre-wrap; word-break:break-word;}
  .msg.bot{align-self:flex-start; background:#242747; color:#d9d5ff; border-bottom-left-radius:4px;}
  .msg.me{align-self:flex-end; background:linear-gradient(135deg,#ff5d8f,#ff7a6b); color:#fff; border-bottom-right-radius:4px;}
  .chatform{display:flex; gap:8px; margin-top:10px;}
  .chatform input{flex:1;}
  .send{border:none; background:linear-gradient(135deg,#ff5d8f,#ff7a6b); color:#fff; font-weight:800; padding:0 16px; border-radius:12px; font-size:15px; cursor:pointer;}
  .hintrow{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .hint{font-size:12px; color:#ffd; background:#2a2350; border:1px solid #45407a; border-radius:999px; padding:5px 10px; cursor:pointer;}

  .actions{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .btn{border:none; border-radius:14px; padding:15px; font-size:16px; font-weight:800; cursor:pointer; transition:.15s;}
  .btn:disabled{opacity:.6; cursor:default;}
  .btn.primary{background:linear-gradient(135deg,#ff6b8b,#ff4d6d); color:#fff; box-shadow:0 10px 24px rgba(255,77,109,.4);}
  .btn.ghost{background:#1b1e38; color:var(--ink); border:1.5px solid var(--line);}
  .btn.gold{background:linear-gradient(135deg,#ffd777,#ffb02e); color:#4a3300;}

  .paybox{margin-top:12px; padding:14px; border-radius:16px; background:linear-gradient(135deg,#2a2340,#3a2b40); border:1px solid #5a4a2e;}
  .paybox .h{font-weight:800; font-size:15px;}
  .paybox .p{font-size:12.5px; color:#d9c9a8; margin:6px 0 10px; line-height:1.5;}
  .paybox.unlocked{background:linear-gradient(135deg,#173026,#1c3a2c); border-color:#2f6b4c;}
  .keyrow{display:flex; gap:8px; margin-top:10px;}
  .keyrow input{flex:1;}
  .unlockbtn{border:none; background:#2fbf71; color:#fff; font-weight:800; padding:0 14px; border-radius:12px; cursor:pointer;}

  .result{margin-top:12px; text-align:center; display:none;}
  .result img{max-width:100%; border-radius:14px; box-shadow:var(--shadow);}
  .result .save-note{font-size:12px; color:var(--sub); margin-top:8px;}

  .footer{ text-align:center; color:var(--sub); font-size:11.5px; margin-top:22px; line-height:1.7;}
  .spin{display:inline-block; width:15px; height:15px; border:2px solid rgba(255,255,255,.5); border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite; vertical-align:-2px; margin-right:6px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .seg .chip{position:relative;}
  .seg .chip .lock{position:absolute; top:3px; right:5px; font-size:10px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.6));}
  body.pro-on .seg .chip .lock{display:none;}
  .paybox.flash{animation:pbf 1.1s ease;}
  @keyframes pbf{0%,100%{box-shadow:var(--shadow)} 25%,75%{box-shadow:0 0 0 3px rgba(255,207,92,.9)}}
  .freelabel{font-size:12.5px; color:#ffd777; font-weight:800; margin-bottom:7px; text-align:center;}
  .upcta{margin-top:10px;}
</style>

すてきな1年になりますように</textarea>

<script>
/* =========================================================
   おいわいメーカー — 無駄に凝ったお祝いGIF
   すべてブラウザ内で完結（サーバー不要 / GitHub Pagesで公開可）
   描画は sprite + glow の多層合成でリッチに。GIFはループ継ぎ目なし。
   ========================================================= */

// ---- カラーユーティリティ ----
function hexToRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
function rgba(h,a){ const c=hexToRgb(h); return `rgba(${c.r},${c.g},${c.b},${a})`; }
function shade(h,amt){ const c=hexToRgb(h); const f=x=>{ const v=amt>=0? x+(255-x)*amt : x*(1+amt); return Math.max(0,Math.min(255,Math.round(v))); }; return `rgb(${f(c.r)},${f(c.g)},${f(c.b)})`; }
function rrect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// ---- テーマ（お祝いの種類）----
const THEMES = {
  birthday:    { label:'HAPPY BIRTHDAY',    bg:['#ff9a9e','#a86bd6'], accent:'#ffd76a', sparkle:'#fff3c4', motif:'confetti', parts:['#ff5d8f','#ffd23f','#5ec7ff','#7be0a3','#c58bff','#ffffff'] },
  congrats:    { label:'CONGRATULATIONS',   bg:['#3a7bd5','#00d2c6'], accent:'#ffd23f', sparkle:'#ffffff', motif:'confetti', parts:['#ffd23f','#ff8fb0','#ffffff','#8affd1','#8ab6ff'] },
  anniversary: { label:'FOR YOU',           bg:['#ff5f7e','#c33764'], accent:'#ffd9a8', sparkle:'#ffdbe6', motif:'hearts',   parts:['#ff92ac','#ffffff','#ffd1dc','#ff6f91'] },
  thanks:      { label:'THANK YOU',         bg:['#3fae86','#e9c24f'], accent:'#fff0b0', sparkle:'#fffde7', motif:'petals',   parts:['#ffd6ec','#fff3b0','#ffffff','#c8f7d4'] },
  // ▼ ふざけ枠（自前で全部描画するテーマ）
  pachinko:    { label:'FEVER', bg:['#5a0d0d','#0a0000'], accent:'#ffd23f', sparkle:'#fff3c4', motif:'coins',    custom:'pachinko', pro:true },
  danmaku:     { label:'',      bg:['#12131a','#05060a'], accent:'#ffffff', sparkle:'#ffffff', motif:'comments', custom:'niconico' },
  cinema:      { label:'',      bg:['#0b0b12','#000000'], accent:'#ffd76a', sparkle:'#fff4c4', motif:'', custom:'cinema', pro:true },
  news:        { label:'',      bg:['#0c2f52','#06121f'], accent:'#ffffff', sparkle:'#bfe0ff', motif:'', custom:'news', pro:true },
  eva:         { label:'',      bg:['#000000','#000000'], accent:'#ffffff', sparkle:'#ffffff', motif:'', custom:'eva' },
  thread:      { label:'',      bg:['#efecd9','#e4dcc8'], accent:'#111111', sparkle:'#cccccc', motif:'', custom:'thread' },
};

// ---- 状態 ----
function themeDefaults(key){
  const t = THEMES[key];
  return { theme:key, label:t.label, bg:t.bg.slice(), accent:t.accent, sparkle:t.sparkle, motif:t.motif,
           textColor:'#ffffff', speed:1, density:1, sparkleAmt:1, nameScale:1 };
}
const state = Object.assign({ premium:false }, themeDefaults('birthday'));

// ---- 要素 ----
const preview = document.getElementById('preview');
const pctx = preview.getContext('2d');
const nameInput = document.getElementById('nameInput');
const msgInput = document.getElementById('msgInput');

// テーマごとのメッセージ例（ユーザーが編集するまでは自動で差し替え）
const DEFAULT_MSG = {
  birthday:'お誕生日おめでとう！\nすてきな1年になりますように',
  congrats:'合格おめでとう！\n本当によく頑張ったね',
  anniversary:'いつもありがとう\nこれからもよろしくね',
  thanks:'本当にありがとう\n感謝しています',
  pachinko:'確変突入\nおめでとう！',
  danmaku:'おめでとう！',
  cinema:'全人類が、祝福した。',
  news:'本日、誕生日を迎えられました',
  eva:'おめでとう',
  thread:'おめでとう！',
};
let msgTouched=false;
msgInput.addEventListener('input', ()=>{ msgTouched=true; });

// ---- スプライトキャッシュ（glow / sparkle / heart / petal）----
const SP = {};
function makeCanvas(s){ const c=document.createElement('canvas'); c.width=c.height=s; return c; }
function getGlow(color){
  const k='g_'+color; if(SP[k]) return SP[k];
  const s=128, cv=makeCanvas(s), x=s/2; const g=cv.getContext('2d');
  const rg=g.createRadialGradient(x,x,0,x,x,x);
  rg.addColorStop(0,rgba(color,.9)); rg.addColorStop(.4,rgba(color,.35)); rg.addColorStop(1,rgba(color,0));
  g.fillStyle=rg; g.fillRect(0,0,s,s); SP[k]=cv; return cv;
}
function getSparkle(color){
  const k='s_'+color; if(SP[k]) return SP[k];
  const s=64, cv=makeCanvas(s), c=s/2, g=cv.getContext('2d');
  const rg=g.createRadialGradient(c,c,0,c,c,c); rg.addColorStop(0,rgba(color,.55)); rg.addColorStop(1,rgba(color,0));
  g.fillStyle=rg; g.fillRect(0,0,s,s);
  const rL=26,rS=5.5, pts=[[0,-rL],[rS,-rS],[rL,0],[rS,rS],[0,rL],[-rS,rS],[-rL,0],[-rS,-rS]];
  g.fillStyle='#ffffff'; g.beginPath();
  pts.forEach((p,i)=>{ const x=c+p[0],y=c+p[1]; i?g.lineTo(x,y):g.moveTo(x,y); }); g.closePath(); g.fill();
  SP[k]=cv; return cv;
}
function getHeart(color){
  const k='h_'+color; if(SP[k]) return SP[k];
  const s=64, cv=makeCanvas(s), g=cv.getContext('2d');
  g.translate(s/2,s/2+3); g.scale(1.5,1.5); g.fillStyle=color;
  g.beginPath(); g.moveTo(0,10);
  g.bezierCurveTo(-14,-6,-14,-22,0,-12); g.bezierCurveTo(14,-22,14,-6,0,10);
  g.closePath(); g.fill();
  g.fillStyle='rgba(255,255,255,.4)'; g.beginPath(); g.ellipse(-5,-7,2.6,4.4,-0.5,0,7); g.fill();
  SP[k]=cv; return cv;
}
function getPetal(color){
  const k='p_'+color; if(SP[k]) return SP[k];
  const s=64, cv=makeCanvas(s), g=cv.getContext('2d');
  g.translate(s/2,s/2);
  const grd=g.createLinearGradient(-14,-14,14,14); grd.addColorStop(0,'#ffffff'); grd.addColorStop(1,color);
  g.fillStyle=grd; g.beginPath(); g.ellipse(0,0,10,17,0.5,0,Math.PI*2); g.fill();
  g.strokeStyle=rgba(color,.5); g.lineWidth=1; g.beginPath(); g.moveTo(-5,-9); g.lineTo(5,9); g.stroke();
  SP[k]=cv; return cv;
}
function getCoin(){
  if(SP.coin) return SP.coin; const s=64, cv=makeCanvas(s), g=cv.getContext('2d'), c=s/2;
  const rg=g.createRadialGradient(c-8,c-8,4,c,c,c-3); rg.addColorStop(0,'#fff6c0'); rg.addColorStop(.5,'#ffcf3a'); rg.addColorStop(1,'#c8860a');
  g.fillStyle=rg; g.beginPath(); g.arc(c,c,c-3,0,Math.PI*2); g.fill();
  g.lineWidth=3; g.strokeStyle='#a86a08'; g.stroke();
  g.fillStyle='#b5760a'; g.font='bold 30px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('★',c,c+1);
  SP.coin=cv; return cv;
}

// ---- シーン構築（決定論：ループが継ぎ目なくなる）----
function rng(seed){ return function(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }; }
let orbs=[], sparkles=[], parts=[], coins=[], comments=[];
function buildScene(){
  const t=THEMES[state.theme];
  let r=rng(9973);
  // 背景の光の玉
  orbs=[]; for(let i=0;i<8;i++){ orbs.push({ x:r(), y:r(), size:0.12+r()*0.28, spd:0.15+r()*0.3, phase:r(), color: r()<0.5? shade(state.accent,.5):'#ffffff', a:0.10+r()*0.16 }); }
  // キラキラ
  r=rng(4242); const ns=Math.round(14*state.sparkleAmt);
  sparkles=[]; for(let i=0;i<ns;i++){ sparkles.push({ x:0.06+r()*0.88, y:0.06+r()*0.88, size:0.02+r()*0.05, phase:r(), spin:(r()<.5?1:-1)*(0.3+r()*0.7) }); }
  parts=[]; coins=[]; comments=[];
  if(t.custom==='pachinko'){
    let r2=rng(555); for(let i=0;i<18;i++){ coins.push({ x:r2(), phase:r2(), spd:0.4+r2()*0.5, size:0.6+r2()*0.7, spin:(r2()<.5?1:-1)*(0.6+r2()*1.0) }); }
    return;
  }
  if(t.custom==='niconico'){ buildComments(); return; }
  if(t.custom){ return; } // 映画/速報/おめでとう/スレ は追加粒子なし（orbs/sparklesのみ使用）
  // メインの舞い散る粒（通常テーマ）
  r=rng(1357);
  const motif=state.motif;
  const baseN = motif==='balloons'?10 : motif==='hearts'?20 : motif==='petals'?26 : 46;
  const n=Math.max(4, Math.round(baseN*state.density));
  const pal=t.parts||['#ffffff'];
  for(let i=0;i<n;i++){
    parts.push({ x:r(), depth:0.55+r()*0.75, color:pal[Math.floor(r()*pal.length)],
      phase:r(), sway:0.01+r()*0.05, swayF:0.6+r()*1.4, spin:(r()<.5?1:-1)*(0.6+r()*1.2),
      size:0.6+r()*0.8 });
  }
}
function buildComments(){
  const nm=(nameInput.value||'').trim();
  const pool=['wwwwww','888888888','おめでとう！','神','ｷﾀ━━━!!','うぽつ','祝','かわいい','天才','ﾜﾛﾀ','最高','www','ﾊﾟﾁﾊﾟﾁ','素晴らしい','神回','尊い','これは良い','おめ！','涙不可避'];
  if(nm){ pool.push(nm+'おめでとう'); pool.push('祝・'+nm); pool.push(nm+'ｷﾀ━!!'); }
  let r=rng(2024); const N=18;
  for(let i=0;i<N;i++){
    const big=r()<0.22, cmd=r()<0.18;
    comments.push({ text:pool[Math.floor(r()*pool.length)], y:0.05+(i/N)*0.9+(r()-0.5)*0.03,
      spd:0.32+r()*0.55, phase:r(), size:big?0.075:0.046,
      color: cmd? (r()<.5?'#ff5a5a':'#7dff8f') : (big?'#ffe25a':'#ffffff') });
  }
}

// ---- テキスト補助 ----
function wrapLines(ctx, text, maxW){
  const out=[]; (text||'').split('\n').forEach(para=>{
    if(para===''){ out.push(''); return; }
    let line='';
    for(const ch of para){ if(ctx.measureText(line+ch).width>maxW && line){ out.push(line); line=ch; } else line+=ch; }
    if(line) out.push(line);
  }); return out;
}
function drawTracked(ctx, text, cx, y, spacing){
  const chars=[...text]; const w=chars.map(c=>ctx.measureText(c).width);
  const total=w.reduce((a,b)=>a+b,0)+spacing*(chars.length-1);
  let x=cx-total/2; ctx.textAlign='left';
  chars.forEach((c,i)=>{ ctx.fillText(c,x,y); x+=w[i]+spacing; }); ctx.textAlign='center';
}

// ---- メイン描画（プレビューも書き出しも共用）----
function drawFrame(ctx, t, S){
  const cust=THEMES[state.theme].custom;
  if(cust==='pachinko'){ drawPachinko(ctx,t,S); drawWatermark(ctx,S); return; }
  if(cust==='niconico'){ drawNiconico(ctx,t,S); drawWatermark(ctx,S); return; }
  if(cust==='cinema'){ drawCinema(ctx,t,S); drawWatermark(ctx,S); return; }
  if(cust==='news'){ drawNews(ctx,t,S); drawWatermark(ctx,S); return; }
  if(cust==='eva'){ drawEva(ctx,t,S); drawWatermark(ctx,S); return; }
  if(cust==='thread'){ drawThread(ctx,t,S); drawWatermark(ctx,S); return; }
  const TAU=Math.PI*2;
  // 背景グラデ
  const bg=ctx.createLinearGradient(0,0,0,S); bg.addColorStop(0,state.bg[0]); bg.addColorStop(1,state.bg[1]);
  ctx.fillStyle=bg; ctx.fillRect(0,0,S,S);
  // 中央上の柔らかい光
  const gy=S*0.36+Math.sin(t*TAU)*S*0.015, rg=ctx.createRadialGradient(S*0.5,gy,0,S*0.5,gy,S*0.72);
  rg.addColorStop(0,rgba('#ffffff',.26)); rg.addColorStop(1,rgba('#ffffff',0));
  ctx.fillStyle=rg; ctx.fillRect(0,0,S,S);

  // 光の玉（奥・加算）
  ctx.globalCompositeOperation='screen';
  for(const o of orbs){
    const prog=((o.phase+t*o.spd)%1);
    const y=(1-prog)*S*1.1 - S*0.05, x=o.x*S+Math.sin((o.phase+t)*TAU)*S*0.03;
    const d=o.size*S, a=o.a*(0.6+0.4*Math.sin((o.phase+t)*TAU));
    ctx.globalAlpha=Math.max(0,a); ctx.drawImage(getGlow(o.color), x-d/2, y-d/2, d, d);
  }
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;

  // メインの粒
  drawMotif(ctx,t,S);

  // キラキラ（前面・加算）
  ctx.globalCompositeOperation='screen';
  for(const s of sparkles){
    const tw=Math.sin((s.phase+t)*TAU); if(tw<=0) continue;
    const d=s.size*S*(0.5+tw), x=s.x*S, y=s.y*S;
    ctx.save(); ctx.translate(x,y); ctx.rotate((s.phase+t)*TAU*s.spin); ctx.globalAlpha=tw;
    ctx.drawImage(getSparkle(state.sparkle), -d/2,-d/2,d,d); ctx.restore();
  }
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;

  // シャインスイープ（斜めの光の帯・ループ）
  const sweep=((t*1.0)%1)*1.6-0.3;
  ctx.save(); ctx.globalCompositeOperation='screen'; ctx.translate(sweep*S,0); ctx.rotate(-0.32);
  const sw=ctx.createLinearGradient(-S*0.18,0,S*0.18,0);
  sw.addColorStop(0,rgba('#ffffff',0)); sw.addColorStop(.5,rgba('#ffffff',.12)); sw.addColorStop(1,rgba('#ffffff',0));
  ctx.fillStyle=sw; ctx.fillRect(-S*0.18,-S*0.5,S*0.36,S*2); ctx.restore();

  // ビネット（周辺減光で締める）
  const vg=ctx.createRadialGradient(S*0.5,S*0.5,S*0.35,S*0.5,S*0.5,S*0.72);
  vg.addColorStop(0,rgba('#000000',0)); vg.addColorStop(1,rgba('#000000',.28));
  ctx.fillStyle=vg; ctx.fillRect(0,0,S,S);

  // テキストを引き立てる中央スクリム（うっすら）
  const tb=ctx.createRadialGradient(S*0.5,S*0.52,S*0.1,S*0.5,S*0.52,S*0.62);
  tb.addColorStop(0,rgba('#000000',.17)); tb.addColorStop(1,rgba('#000000',0));
  ctx.fillStyle=tb; ctx.fillRect(0,0,S,S);

  // テキスト
  drawText(ctx,t,S);

  // 上品な内枠（designed感）
  const fm=S*0.05;
  ctx.strokeStyle=rgba('#ffffff',.38); ctx.lineWidth=Math.max(1,S*0.0035);
  rrect(ctx,fm,fm,S-2*fm,S-2*fm,S*0.035); ctx.stroke();

  // 透かし（無料版）
  drawWatermark(ctx,S);
}

let EXPORTING=false; // 書き出し中だけ透かしを焼く（プレビューは常にキレイ）
function drawWatermark(ctx,S){
  if(state.premium || !EXPORTING) return;
  ctx.save();
  const txt='🆓 無料版 · おいわいメーカー', fs=Math.round(S*0.034);
  ctx.font=`700 ${fs}px sans-serif`;
  const w=ctx.measureText(txt).width, padX=S*0.032, h=fs+S*0.03, bw=w+padX*2, bx=(S-bw)/2, by=S-h-S*0.028;
  ctx.fillStyle='rgba(0,0,0,.45)'; rrect(ctx,bx,by,bw,h,h/2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.94)'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(txt,S/2,by+h/2+0.5);
  ctx.restore();
}

function drawMotif(ctx,t,S){
  const TAU=Math.PI*2, motif=state.motif;
  for(const p of parts){
    const prog=(p.phase+t)%1;
    const sway=Math.sin((p.phase+t)*TAU*p.swayF)*p.sway*S;
    ctx.globalAlpha=Math.min(1,p.depth);
    if(motif==='balloons'){
      const y=S*1.08-prog*S*1.22, x=p.x*S+sway, w=S*0.05*p.size*p.depth, h=w*1.25;
      ctx.strokeStyle=rgba('#ffffff',.45); ctx.lineWidth=Math.max(1,S*0.003);
      ctx.beginPath(); ctx.moveTo(x,y+h); ctx.lineTo(x+S*0.008,y+h+S*0.07); ctx.stroke();
      ctx.fillStyle=p.color; ctx.beginPath(); ctx.ellipse(x,y,w,h,0,0,TAU); ctx.fill();
      ctx.fillStyle=rgba('#ffffff',.4); ctx.beginPath(); ctx.ellipse(x-w*0.3,y-h*0.3,w*0.28,h*0.28,0,0,TAU); ctx.fill();
    } else if(motif==='hearts' || motif==='petals'){
      const y=((p.phase+t)%1)*S*1.1-S*0.05, x=p.x*S+sway, d=S*(motif==='hearts'?0.066:0.06)*p.size*p.depth;
      ctx.save(); ctx.translate(x,y); ctx.rotate((p.phase+t)*TAU*p.spin*0.5);
      ctx.drawImage((motif==='hearts'?getHeart:getPetal)(p.color), -d/2,-d/2,d,d); ctx.restore();
    } else { // confetti
      const y=((p.phase+t)%1)*S*1.1-S*0.05, x=p.x*S+sway, s=S*0.02*p.size*p.depth;
      const flip=Math.cos((p.phase+t)*TAU*p.spin*1.6);
      ctx.save(); ctx.translate(x,y); ctx.rotate((p.phase+t)*TAU*p.spin);
      ctx.fillStyle=p.color; ctx.fillRect(-s*0.5, -s*1.4*Math.abs(flip)-0.1, s, s*2.8*Math.abs(flip)+0.2);
      ctx.restore();
    }
  }
  ctx.globalAlpha=1;
}

function drawText(ctx,t,S){
  const TAU=Math.PI*2;
  ctx.textAlign='center'; ctx.textBaseline='middle';

  // サブラベル（英字・字間・箔）
  const label=state.label||'';
  if(label){
    const ly=S*0.285, fs=Math.round(S*0.05);
    ctx.font=`700 ${fs}px "Helvetica Neue",Arial,sans-serif`;
    const grd=ctx.createLinearGradient(0,ly-fs,0,ly+fs);
    grd.addColorStop(0,shade(state.accent,.55)); grd.addColorStop(1,state.accent);
    ctx.shadowColor=rgba(state.accent,.6); ctx.shadowBlur=S*0.02;
    ctx.fillStyle=grd; drawTracked(ctx,label,S*0.5,ly,S*0.018);
    ctx.shadowBlur=0;
  }

  // 名前（大・箔押し風グラデ＋グロウ＋白フチ）
  const nm=(nameInput.value||'').trim();
  if(nm){
    const ny=S*0.45, nfs=Math.round(S*0.135*state.nameScale);
    ctx.font=`800 ${nfs}px -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif`;
    const ng=ctx.createLinearGradient(0,ny-nfs*0.7,0,ny+nfs*0.7);
    ng.addColorStop(0,shade(state.accent,.6)); ng.addColorStop(.5,state.accent); ng.addColorStop(1,shade(state.accent,-.18));
    // やわらかな発光ハロー
    ctx.save(); ctx.shadowColor=rgba(state.accent,.55); ctx.shadowBlur=S*0.03*(0.9+0.1*Math.sin(t*TAU));
    ctx.fillStyle=state.accent; ctx.fillText(nm,S*0.5,ny); ctx.restore();
    // 暗フチ→白フチ→箔グラデ で どんな背景でもクッキリ
    ctx.lineJoin='round';
    ctx.lineWidth=Math.max(2,S*0.011); ctx.strokeStyle=rgba('#000000',.28); ctx.strokeText(nm,S*0.5,ny);
    ctx.lineWidth=Math.max(1,S*0.004); ctx.strokeStyle=rgba('#ffffff',.55); ctx.strokeText(nm,S*0.5,ny);
    ctx.fillStyle=ng; ctx.fillText(nm,S*0.5,ny);

    // 装飾ディバイダ
    const dy=S*0.545, dw=S*0.14;
    ctx.strokeStyle=rgba('#ffffff',.55); ctx.lineWidth=Math.max(1,S*0.0035);
    ctx.beginPath(); ctx.moveTo(S*0.5-dw,dy); ctx.lineTo(S*0.5-S*0.02,dy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(S*0.5+S*0.02,dy); ctx.lineTo(S*0.5+dw,dy); ctx.stroke();
    ctx.fillStyle=rgba('#ffffff',.7); ctx.save(); ctx.translate(S*0.5,dy); ctx.rotate(Math.PI/4);
    ctx.fillRect(-S*0.008,-S*0.008,S*0.016,S*0.016); ctx.restore();
  }

  // メッセージ
  ctx.fillStyle=state.textColor; const mfs=Math.round(S*0.058);
  ctx.font=`600 ${mfs}px -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif`;
  ctx.shadowColor=rgba('#000000',.35); ctx.shadowBlur=S*0.012; ctx.shadowOffsetY=S*0.003;
  const lines=wrapLines(ctx,msgInput.value,S*0.84);
  let y=S*0.635; for(const ln of lines){ ctx.fillText(ln,S*0.5,y); y+=mfs*1.32; }
  ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
}

// ===== ふざけ枠①：パチンコ大当り演出（ガチ）=====
function pSpeedLines(ctx,t,S){ // 集中線
  const cx=S/2, cy=S/2, N=52; ctx.save(); ctx.translate(cx,cy); ctx.rotate(t*0.35);
  for(let i=0;i<N;i++){ const a=(i/N)*Math.PI*2, w=(i%2?0.008:0.017)*S*(0.7+0.5*Math.sin(i*2.3+t*8));
    ctx.save(); ctx.rotate(a); ctx.fillStyle=i%2?'rgba(255,205,60,.15)':'rgba(255,70,70,.11)';
    ctx.beginPath(); ctx.moveTo(S*0.13,-w*0.4); ctx.lineTo(S,-w*1.8); ctx.lineTo(S,w*1.8); ctx.lineTo(S*0.13,w*0.4); ctx.closePath(); ctx.fill(); ctx.restore(); }
  ctx.restore();
}
function pReels(ctx,t,S){ // ７７７リール（枠付き・揃い光）
  const y=S*0.155, bw=S*0.185, bh=S*0.175, gap=S*0.018, tot=bw*3+gap*2, x0=S/2-tot/2;
  for(let i=0;i<3;i++){ const x=x0+i*(bw+gap);
    ctx.fillStyle='#241100'; rrect(ctx,x-S*0.008,y-bh/2-S*0.008,bw+S*0.016,bh+S*0.016,10); ctx.fill();
    const wg=ctx.createLinearGradient(0,y-bh/2,0,y+bh/2); wg.addColorStop(0,'#0c0c0c'); wg.addColorStop(.5,'#3a3a3a'); wg.addColorStop(1,'#0c0c0c');
    ctx.fillStyle=wg; rrect(ctx,x,y-bh/2,bw,bh,8); ctx.fill();
    ctx.lineWidth=Math.max(2,S*0.007); ctx.strokeStyle='#ffcf3a'; rrect(ctx,x,y-bh/2,bw,bh,8); ctx.stroke();
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=`900 ${Math.round(bh*0.82)}px "Arial Black","Arial",sans-serif`;
    ctx.lineWidth=Math.max(2,S*0.009); ctx.strokeStyle='#ffe37a'; ctx.strokeText('7',x+bw/2,y+bh*0.02);
    const g7=ctx.createLinearGradient(0,y-bh*0.4,0,y+bh*0.4); g7.addColorStop(0,'#ff7b7b'); g7.addColorStop(1,'#c00000');
    ctx.fillStyle=g7; ctx.fillText('7',x+bw/2,y+bh*0.02);
    ctx.fillStyle='rgba(255,255,255,.10)'; rrect(ctx,x+2,y-bh/2+2,bw-4,bh*0.34,7); ctx.fill();
  }
  ctx.save(); ctx.globalCompositeOperation='screen'; ctx.globalAlpha=0.35+0.35*Math.sin(t*Math.PI*2*3);
  ctx.fillStyle='rgba(255,240,150,.7)'; ctx.fillRect(x0-S*0.01,y-S*0.007,tot+S*0.02,S*0.014); ctx.restore();
}
function pBadge(ctx,cx,cy,r,fill,text,tsize,tcol,t){ // 激アツ/確定のカットインバッジ
  const spikes=13; ctx.save(); ctx.translate(cx,cy); ctx.rotate(t*0.6);
  ctx.beginPath(); for(let i=0;i<spikes*2;i++){ const rr=i%2?r:r*0.68, a=(i/(spikes*2))*Math.PI*2; const x=Math.cos(a)*rr,y=Math.sin(a)*rr; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle='#fff'; ctx.stroke();
  ctx.rotate(-t*0.6); ctx.fillStyle=tcol; ctx.font=`900 ${tsize}px "Hiragino Sans","Noto Sans JP",sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text,0,0); ctx.restore();
}
function pHold(ctx,t,S){ // 保留変化（青→緑→赤→金→虹）
  const y=S*0.775, n=5, gap=S*0.058, r=S*0.02, x0=S/2-gap*(n-1)/2, cols=['#4da6ff','#3ddc84','#ff4d4d','#ffcf3a'];
  for(let i=0;i<n;i++){ const x=x0+i*gap, rainbow=(i===n-1);
    if(rainbow){ const h=(t*360)%360; ctx.fillStyle=`hsl(${h},100%,60%)`; ctx.shadowColor=`hsl(${h},100%,60%)`; ctx.shadowBlur=S*0.03; }
    else { ctx.fillStyle=cols[i]; ctx.shadowColor=cols[i]; ctx.shadowBlur=S*0.012; }
    ctx.beginPath(); ctx.arc(x,y,rainbow?r*1.35:r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(x-r*0.3,y-r*0.3,r*0.28,0,Math.PI*2); ctx.fill();
  }
}
function pLED(ctx,t,S){ // ドット風LEDカウンター
  const bw=S*0.52, bh=S*0.072, x=S/2-bw/2, y=S*0.85;
  ctx.fillStyle='#080808'; rrect(ctx,x,y,bw,bh,6); ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='#2a2a2a'; ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=`900 ${Math.round(bh*0.58)}px "Courier New",monospace`;
  const on=Math.sin(t*Math.PI*2*2)>-0.3;
  ctx.shadowColor='#ff8a00'; ctx.shadowBlur=S*0.02; ctx.fillStyle=on?'#ffb43a':'#7a4a00';
  ctx.fillText('◆ 1500玉 GET !! ◆',S/2,y+bh/2+1); ctx.shadowBlur=0;
}
function drawPachinko(ctx,t,S){
  const TAU=Math.PI*2, cx=S/2, hue=(t*360)%360;
  const bg=ctx.createRadialGradient(cx,S*0.46,S*0.05,cx,S*0.5,S*0.9);
  bg.addColorStop(0,'#7a1414'); bg.addColorStop(.6,'#3a0505'); bg.addColorStop(1,'#050000');
  ctx.fillStyle=bg; ctx.fillRect(0,0,S,S);
  pSpeedLines(ctx,t,S);
  // 虹オーラ（名前の後ろ・確定オーラ）
  const ag=ctx.createRadialGradient(cx,S*0.5,0,cx,S*0.5,S*0.42);
  ag.addColorStop(0,`hsla(${hue},100%,60%,.4)`); ag.addColorStop(.6,`hsla(${(hue+60)%360},100%,55%,.14)`); ag.addColorStop(1,'transparent');
  ctx.fillStyle=ag; ctx.fillRect(0,S*0.24,S,S*0.52);
  // コイン
  for(const c of coins){ const prog=(c.phase+t*c.spd)%1, y=prog*S*1.12-S*0.06, x=c.x*S+Math.sin((c.phase+t)*TAU)*S*0.02, d=S*0.07*c.size;
    ctx.save(); ctx.translate(x,y); ctx.rotate((c.phase+t)*TAU*c.spin); ctx.scale(Math.cos((c.phase+t)*TAU*c.spin*1.4),1); ctx.drawImage(getCoin(),-d/2,-d/2,d,d); ctx.restore(); }
  // キラ
  ctx.globalCompositeOperation='screen';
  for(const s of sparkles){ const tw=Math.sin((s.phase+t)*TAU); if(tw<=0)continue; const d=s.size*S*(0.6+tw); ctx.save(); ctx.translate(s.x*S,s.y*S); ctx.globalAlpha=tw; ctx.drawImage(getSparkle('#fff3c4'),-d/2,-d/2,d,d); ctx.restore(); }
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  // リール
  pReels(ctx,t,S);
  // カットインバッジ（激アツ / 確定）
  const pb=1+0.08*Math.sin(t*TAU*3);
  pBadge(ctx,S*0.145,S*0.145,S*0.072*pb,'#e60000','激アツ',Math.round(S*0.036),'#fff',t);
  pBadge(ctx,S*0.855,S*0.145,S*0.07*pb,`hsl(${hue},100%,55%)`,'確定',Math.round(S*0.04),'#fff',t);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  // ★大当り★
  ctx.save(); ctx.translate(cx,S*0.315); const pB=1+0.05*Math.sin(t*TAU*3); ctx.scale(pB,pB);
  ctx.font=`900 ${Math.round(S*0.092)}px "Hiragino Sans","Noto Sans JP",sans-serif`;
  ctx.lineWidth=S*0.016; ctx.strokeStyle='#5a0000'; ctx.strokeText('★ 大当り ★',0,0);
  const bgd=ctx.createLinearGradient(0,-S*0.05,0,S*0.05); bgd.addColorStop(0,'#fff6b0'); bgd.addColorStop(1,'#ffb200');
  ctx.fillStyle=bgd; ctx.fillText('★ 大当り ★',0,0); ctx.restore();
  // 名前（激アツ・微振動）
  const nm=(nameInput.value||'').trim();
  if(nm){ const shake=Math.sin(t*TAU*10)*S*0.006; ctx.save(); ctx.translate(cx+shake,S*0.5);
    const nfs=Math.round(S*0.15*state.nameScale); ctx.font=`900 ${nfs}px "Hiragino Sans","Noto Sans JP",sans-serif`;
    ctx.shadowColor=rgba('#ffcf3a',.9); ctx.shadowBlur=S*0.055;
    ctx.lineWidth=S*0.018; ctx.strokeStyle='#5a0000'; ctx.strokeText(nm,0,0); ctx.shadowBlur=0;
    ctx.lineWidth=S*0.006; ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.strokeText(nm,0,0);
    const ng=ctx.createLinearGradient(0,-nfs*0.6,0,nfs*0.6); ng.addColorStop(0,'#fff8d0'); ng.addColorStop(.5,'#ffd23f'); ng.addColorStop(1,'#e08a12');
    ctx.fillStyle=ng; ctx.fillText(nm,0,0); ctx.restore(); }
  // メッセージ
  ctx.fillStyle='#ffffff'; const mfs=Math.round(S*0.05);
  ctx.font=`800 ${mfs}px "Hiragino Sans","Noto Sans JP",sans-serif`; ctx.lineWidth=mfs*0.22; ctx.strokeStyle='rgba(90,0,0,.9)';
  const lines=wrapLines(ctx,msgInput.value,S*0.8); let y=S*0.635; for(const ln of lines){ ctx.strokeText(ln,cx,y); ctx.fillText(ln,cx,y); y+=mfs*1.28; }
  // 保留 & LED
  pHold(ctx,t,S); pLED(ctx,t,S);
  // 虹枠（本物の虹・回転）
  const fm=S*0.026, hues=[0,45,95,160,210,285];
  for(let i=0;i<hues.length;i++){ const off=fm+i*S*0.0075, h=(hues[i]+t*150)%360;
    ctx.strokeStyle=`hsl(${h},100%,60%)`; ctx.lineWidth=S*0.0072; rrect(ctx,off,off,S-2*off,S-2*off,S*0.045-i*S*0.004); ctx.stroke(); }
}

// ===== ふざけ枠②：弾幕（ニコニコ風コメント）=====
function drawNiconico(ctx,t,S){
  const bg=ctx.createLinearGradient(0,0,0,S); bg.addColorStop(0,'#12131a'); bg.addColorStop(1,'#05060a');
  ctx.fillStyle=bg; ctx.fillRect(0,0,S,S);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  // タイトル（名前＋メッセージ）
  const nm=(nameInput.value||'').trim();
  if(nm){ const nfs=Math.round(S*0.135*state.nameScale); ctx.font=`900 ${nfs}px "Hiragino Sans","Noto Sans JP",sans-serif`;
    ctx.lineWidth=S*0.013; ctx.strokeStyle='rgba(0,0,0,.9)'; ctx.strokeText(nm,S*0.5,S*0.43);
    ctx.fillStyle='#ffffff'; ctx.fillText(nm,S*0.5,S*0.43); }
  { const mfs=Math.round(S*0.056); ctx.font=`800 ${mfs}px "Hiragino Sans","Noto Sans JP",sans-serif`;
    const lines=wrapLines(ctx,msgInput.value,S*0.82); let y=S*0.58;
    for(const ln of lines){ ctx.lineWidth=mfs*0.2; ctx.strokeStyle='rgba(0,0,0,.9)'; ctx.strokeText(ln,S*0.5,y); ctx.fillStyle='#ffe25a'; ctx.fillText(ln,S*0.5,y); y+=mfs*1.32; } }
  // 弾幕コメント（右→左へ流れる）
  ctx.textAlign='left';
  for(const c of comments){ const size=Math.round(c.size*S); ctx.font=`bold ${size}px "Hiragino Sans","Noto Sans JP",sans-serif`;
    const w=ctx.measureText(c.text).width, span=S+w, x=S-((c.phase+t*c.spd)%1)*span, y=c.y*S;
    ctx.lineWidth=size*0.16; ctx.strokeStyle='rgba(0,0,0,.85)'; ctx.strokeText(c.text,x,y);
    ctx.fillStyle=c.color; ctx.fillText(c.text,x,y); }
  // 下部シークバー（それっぽさ）
  ctx.fillStyle='rgba(255,255,255,.16)'; ctx.fillRect(S*0.05,S*0.93,S*0.9,S*0.012);
  ctx.fillStyle='#ff3355'; ctx.fillRect(S*0.05,S*0.93,S*0.9*(t%1),S*0.012);
  ctx.beginPath(); ctx.fillStyle='#ff3355'; ctx.arc(S*0.05+S*0.9*(t%1),S*0.936,S*0.012,0,Math.PI*2); ctx.fill();
  ctx.textAlign='left';
}

// ===== ネタ枠①：映画予告風（全世界が泣いた／製作費5兆円）=====
function drawCinema(ctx,t,S){
  const TAU=Math.PI*2, cx=S/2, MIN='"Hiragino Mincho ProN","Yu Mincho",serif';
  const bg=ctx.createRadialGradient(cx,S*0.42,S*0.05,cx,S*0.5,S*0.9); bg.addColorStop(0,'#1b1b26'); bg.addColorStop(1,'#000');
  ctx.fillStyle=bg; ctx.fillRect(0,0,S,S);
  // スポットライト
  ctx.save(); ctx.globalCompositeOperation='screen'; const sx=cx+Math.sin(t*TAU)*S*0.22;
  const sg=ctx.createRadialGradient(sx,S*0.3,0,sx,S*0.3,S*0.6); sg.addColorStop(0,'rgba(255,240,200,.12)'); sg.addColorStop(1,'transparent');
  ctx.fillStyle=sg; ctx.fillRect(0,0,S,S); ctx.restore();
  // 光の粉
  ctx.save(); ctx.globalCompositeOperation='screen';
  for(const s of sparkles){ const y=(((s.phase - t*0.1)%1)+1)%1, a=0.25+0.3*Math.sin((s.phase+t)*TAU), d=s.size*S*0.5;
    ctx.globalAlpha=Math.max(0,a); ctx.drawImage(getSparkle('#fff4c4'), s.x*S-d/2, y*S-d/2, d, d); }
  ctx.restore(); ctx.globalAlpha=1;
  // レターボックス
  ctx.fillStyle='#000'; ctx.fillRect(0,0,S,S*0.08); ctx.fillRect(0,S*0.92,S,S*0.08);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#ffd23f'; ctx.font=`${Math.round(S*0.05)}px serif`; ctx.fillText('★ ★ ★ ★ ★',cx,S*0.185);
  ctx.fillStyle='#fff'; ctx.font=`${Math.round(S*0.044)}px ${MIN}`; ctx.fillText('全 世 界 が 、 泣 い た 。',cx,S*0.255);
  const nm=(nameInput.value||'').trim();
  if(nm){ const p=1+0.02*Math.sin(t*TAU); ctx.save(); ctx.translate(cx,S*0.42); ctx.scale(p,p);
    const nfs=Math.round(S*0.155*state.nameScale); ctx.font=`900 ${nfs}px ${MIN}`;
    ctx.shadowColor='rgba(255,210,120,.5)'; ctx.shadowBlur=S*0.04;
    const g=ctx.createLinearGradient(0,-nfs*0.6,0,nfs*0.6); g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#ffcf6a'); ctx.fillStyle=g;
    ctx.fillText(nm,0,0); ctx.restore(); ctx.shadowBlur=0; }
  ctx.fillStyle='#f0e6d0'; const mfs=Math.round(S*0.05); ctx.font=`${mfs}px ${MIN}`;
  const lines=wrapLines(ctx,msgInput.value,S*0.82); let y=S*0.575; for(const ln of lines){ ctx.fillText(ln,cx,y); y+=mfs*1.35; }
  ctx.fillStyle='#cfc6b2'; ctx.font=`${Math.round(S*0.031)}px ${MIN}`; ctx.fillText('「人生で、一番の日だった」——全国映画評論家',cx,S*0.74);
  ctx.fillStyle='#ffd23f'; ctx.font=`900 ${Math.round(S*0.04)}px sans-serif`; ctx.fillText('製作費 5兆円 ／ 全国ロードショー',cx,S*0.865);
  // 感動 判子
  ctx.save(); ctx.translate(S*0.82,S*0.28); ctx.rotate(-0.2); ctx.strokeStyle='#ff3b3b'; ctx.lineWidth=S*0.006;
  ctx.beginPath(); ctx.arc(0,0,S*0.078,0,TAU); ctx.stroke();
  ctx.fillStyle='#ff3b3b'; ctx.font=`900 ${Math.round(S*0.056)}px ${MIN}`; ctx.fillText('感動',0,S*0.004); ctx.restore();
}

const chatlog=document.getElementById('chatlog');

function has(s,...w){ return w.some(x=>s.includes(x)); }
const COLORS={ '赤':'#ff4d6d','ピンク':'#ff5d8f','桃':'#ff5d8f','青':'#4d94ff','水色':'#5ec7ff','空色':'#5ec7ff','緑':'#43c59e','黄':'#ffd23f','黄色':'#ffd23f','金':'#ffd76a','ゴールド':'#ffd76a','白':'#ffffff','黒':'#2b2333','紫':'#a06bff','オレンジ':'#ff924c','橙':'#ff924c' };
const BG_WORDS={ '夜':['#0f2027','#2c5364'],'夜空':['#0f2027','#2c5364'],'暗':['#0f2027','#2c5364'],'ナイト':['#0f2027','#203a43'],'青':['#4facfe','#00f2fe'],'ブルー':['#4facfe','#00f2fe'],'空':['#4facfe','#a6e3ff'],'金':['#f6d365','#fda085'],'ゴールド':['#f6d365','#fda085'],'夕':['#ff9a5a','#ff5d8f'],'緑':['#43c6ac','#f8ffae'],'ミント':['#a1ffce','#d9fff0'],'紫':['#a18cd1','#fbc2eb'],'ピンク':['#ff9a9e','#fecfef'],'桃':['#ff9a9e','#fecfef'] };

function handleChat(raw){
  const s=raw.trim(); if(!s) return; const applied=[];
  // ヘルプ
  if(has(s,'使い方','ヘルプ','何が','なにが','help')){
    addMsg('こんなことが言えるよ👇\n・パチンコにして / 弾幕にして（ふざけ枠🤣）\n・誕生日 / 記念日 / 感謝 に切替\n・ハートを降らせて / 風船を飛ばして / 花びらに\n・キラキラ増やして\n・背景を夜空に\n・文字を白く / 名前を金色に\n・名前を大きく / 小さく\n・もっと派手に / シンプルに\n・動きを速く / ゆっくり\n・リセット','bot'); return;
  }
  // テーマ切替（ふざけ枠含む）
  const TW={ 'パチンコ':'pachinko','ぱちんこ':'pachinko','大当':'pachinko','フィーバー':'pachinko','スロット':'pachinko','弾幕':'danmaku','ニコニコ':'danmaku','コメント':'danmaku','映画':'cinema','予告':'cinema','全米':'cinema','全世界':'cinema','速報':'news','ニュース':'news','テロップ':'news','黒画面':'eva','エヴァ':'eva','スレ':'thread','掲示板':'thread','なんJ':'thread','誕生':'birthday','記念':'anniversary','感謝':'thanks' };
  for(const [w,key] of Object.entries(TW)){ if(s.includes(w)){ applyTheme(key); addMsg('テーマを「'+w+'」系に変えたよ！✨','bot'); return; } }
  // モチーフ
  if(has(s,'ハート','はーと')){ state.motif='hearts'; buildScene(); applied.push('ハートを舞わせ'); }
  if(has(s,'風船','バルーン')){ state.motif='balloons'; buildScene(); applied.push('風船を飛ばし'); }
  if(has(s,'花びら','花吹雪','桜','ペタル')){ state.motif='petals'; buildScene(); applied.push('花びらを舞わせ'); }
  if(has(s,'紙吹雪','コンフェ','紙ふぶき')){ state.motif='confetti'; buildScene(); applied.push('紙吹雪に'); }
  // キラキラ量
  if(has(s,'キラキラ','きらきら','星','輝')){ if(has(s,'減ら','少な')){ state.sparkleAmt=Math.max(0.3,state.sparkleAmt-0.6); applied.push('キラキラ控えめに'); } else { state.sparkleAmt=Math.min(2.4,state.sparkleAmt+0.7); applied.push('キラキラ増や'); } buildScene(); }
  // 背景
  if(has(s,'背景','バック','後ろ','空')){ for(const [w,cols] of Object.entries(BG_WORDS)){ if(s.includes(w)){ state.bg=cols.slice(); applied.push('背景を変更'); break; } } }
  // 名前の色（accent）
  if(has(s,'名前') && has(s,'色','金','ゴールド','赤','青','白','ピンク','緑','紫','黄','オレンジ')){
    for(const [w,hex] of Object.entries(COLORS)){ if(s.includes(w)){ state.accent=hex; applied.push(`名前を「${w}」に`); break; } }
  }
  // 文字色（メッセージ）
  if(has(s,'文字','字','テキスト','メッセージ') && !has(s,'名前') && has(s,'色','赤','青','白','ピンク','緑','紫','黄','金','オレンジ','黒')){
    for(const [w,hex] of Object.entries(COLORS)){ if(s.includes(w)){ state.textColor=hex; applied.push(`文字を「${w}」に`); break; } }
  }
  // 名前サイズ
  if(has(s,'名前','字','文字')){ if(has(s,'大き')){ state.nameScale=Math.min(1.6,state.nameScale+0.2); applied.push('名前を大きく'); } else if(has(s,'小さ')){ state.nameScale=Math.max(0.6,state.nameScale-0.2); applied.push('名前を小さく'); } }
  // 速度
  if(has(s,'速く','はやく','スピード')){ state.speed=Math.min(2.2,state.speed+0.35); applied.push('動きを速く'); }
  if(has(s,'ゆっく','遅く','おそく')){ state.speed=Math.max(0.4,state.speed-0.35); applied.push('動きをゆっくり'); }
  // 密度
  if(has(s,'派手','増や','もっと','たくさん','いっぱい') && !has(s,'キラキラ','きらきら')){ state.density=Math.min(2.4,state.density+0.4); buildScene(); applied.push('もっと派手に'); }
  if(has(s,'シンプル','減ら','少な','控えめ') && !has(s,'キラキラ','きらきら')){ state.density=Math.max(0.3,state.density-0.4); buildScene(); applied.push('シンプルに'); }
  // リセット
  if(has(s,'リセット','戻し','戻す','元に')){ Object.assign(state, themeDefaults(state.theme), {premium:state.premium}); buildScene(); applied.push('最初の状態に戻し'); }

  if(applied.length) addMsg(applied.join('、')+'たよ！✨ プレビューを見てね。','bot');
  else addMsg('うーん、うまく分からなかった🙏「ハートを降らせて」「背景を夜空に」みたいに言ってみて。\n「使い方」と打つと一覧が出るよ。','bot');
}

  // プレミアムネタは保存の瞬間に課金導線へ（プレビューはフルで見せる）
  if(THEMES[state.theme].pro && !state.premium){ showProGate(); return; }
  if(typeof GIF==='undefined'){ alert('GIFライブラリの読み込みに失敗しました。通信環境を確認してもう一度お試しください。'); return; }
  const label=dlBtn.textContent; dlBtn.disabled=true; dlBtn.innerHTML='<span class="spin"></span>作成中… 0%';
  await ensureWorker();
  // 無料=低画質・カクカク / ¥100=高画質・なめらか
  const S=state.premium?512:320, frames=state.premium?30:18, delay=state.premium?60:95;
  const gif=new GIF({ workers:2, quality:10, width:S, height:S, workerScript:workerUrl, repeat:0 });
  const off=makeCanvas(S), octx=off.getContext('2d');
  EXPORTING=true;
  for(let f=0; f<frames; f++){ drawFrame(octx, f/frames, S); gif.addFrame(octx,{copy:true, delay}); }
  EXPORTING=false;
  gif.on('progress', p=>{ dlBtn.innerHTML='<span class="spin"></span>作成中… '+Math.round(p*100)+'%'; });
  gif.on('finished', blob=>{ showResult(blob); dlBtn.disabled=false; dlBtn.textContent=label; });
  gif.render();
});

function showResult(blob){
  const url=URL.createObjectURL(blob);
  document.getElementById('resultImg').src=url;
  document.getElementById('saveLink').href=url;
  const res=document.getElementById('result'); res.style.display='block'; res.scrollIntoView({behavior:'smooth',block:'center'});
  const free=!state.premium;
  document.getElementById('freeLabel').style.display=free?'block':'none';
  document.getElementById('upCta').style.display=free?'block':'none';
  const shareBtn=document.getElementById('shareBtn');
  try{
    const file=new File([blob],'oiwai.gif',{type:'image/gif'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ shareBtn.style.display='block'; shareBtn.onclick=()=>navigator.share({files:[file],title:'おめでとう！',text:'🎉'}).catch(()=>{}); }
    else shareBtn.style.display='none';
  }catch(e){ shareBtn.style.display='none'; }
}

// ============ 課金・ライセンス解除（Gumroad） ============
const LS_KEY='oiwai_license_key';
const paybox=document.getElementById('paybox'), buyBtn=document.getElementById('buyBtn'), keyInput=document.getElementById('keyInput'), unlockBtn=document.getElementById('unlockBtn');
const PB_H='✨ ¥100で“ちゃんとしたやつ”に（買い切り・全部解放）';
const PB_P='💎パチンコ・5兆円・速報… 全ネタ保存OK＋高画質＆なめらか＋ロゴなし。プレビューはずっと無料。';
function reflectPremium(){
  if(state.premium){
    document.body.classList.add('pro-on');
    paybox.classList.add('unlocked');
    paybox.querySelector('.h').textContent='✅ 解放済み — 全ネタ保存OK・高画質・ロゴなし';
    paybox.querySelector('.p').textContent='ありがとう！好きなだけ作って送ってね🎁';
    buyBtn.style.display='none';
    const fl=document.getElementById('freeLabel'), uc=document.getElementById('upCta'); if(fl)fl.style.display='none'; if(uc)uc.style.display='none';
  }
  updateMakeButton();
  document.getElementById('verState').textContent=state.premium?'· Premium':'· Free';
}
function updateMakeButton(){
  if(state.premium) dlBtn.textContent='🎁 GIFを作る（高画質・ロゴなし）';
  else if(THEMES[state.theme].pro) dlBtn.textContent='🔒 保存は¥100（プレミアムネタ）';
  else dlBtn.textContent='🎁 GIFを作る（無料）';
}
function resetPaybox(){ if(state.premium) return; paybox.classList.remove('flash'); paybox.querySelector('.h').textContent=PB_H; paybox.querySelector('.p').textContent=PB_P; }
function flashPaybox(){ paybox.scrollIntoView({behavior:'smooth',block:'center'}); paybox.classList.remove('flash'); void paybox.offsetWidth; paybox.classList.add('flash'); }
function showProGate(){
  const nm={pachinko:'パチンコ',cinema:'映画予告(5兆円)',news:'速報'}[state.theme]||'このネタ';
  paybox.querySelector('.h').textContent=`🔒『${nm}』はプレミアムネタ`;
  paybox.querySelector('.p').textContent='プレビューはフルで見れるよ😎 保存＆全ネタ解放は¥100（買い切り）。高画質＆ロゴなしにもなる。';
  flashPaybox();
  addMsg(`「${nm}」はプレミアムネタ🔒 見た目はフルで確認OK。保存＆全部解放は¥100だよ✨`,'bot');
}
buyBtn.addEventListener('click', ()=>{ const url=(window.GUMROAD&&window.GUMROAD.productUrl)||''; if(url) window.open(url,'_blank','noopener'); else alert('現在準備中です🙏 まもなく購入できるようになります。'); });
document.getElementById('upBtn').addEventListener('click', flashPaybox);
async function verifyLicense(key){
  const permalink=(window.GUMROAD&&window.GUMROAD.permalink)||''; if(!permalink) return {ok:false,reason:'not_configured'};
  try{
    const res=await fetch('https://api.gumroad.com/v2/licenses/verify',{ method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams({product_permalink:permalink,license_key:key,increment_uses_count:'false'}) });
    const data=await res.json(); const refunded=data&&data.purchase&&(data.purchase.refunded||data.purchase.chargebacked);
    return {ok:!!(data&&data.success)&&!refunded, data};
  }catch(e){ return {ok:false,reason:'network'}; }
}
unlockBtn.addEventListener('click', async ()=>{
  const key=keyInput.value.trim(); if(!key){ alert('ライセンスキーを貼り付けてね'); return; }
  unlockBtn.textContent='確認中…'; const r=await verifyLicense(key); unlockBtn.textContent='解除';
  if(r.ok){ state.premium=true; localStorage.setItem(LS_KEY,key); reflectPremium(); addMsg('全ネタ解放！🎉 高画質・なめらか・ロゴなしで保存できるよ✨','bot'); }
  else if(r.reason==='not_configured') alert('準備中です🙏（開発者へ: Gumroadのpermalinkを設定してください）');
  else alert('キーを確認できませんでした。コピー内容をもう一度チェックしてね。');
});
(async function restore(){ const saved=localStorage.getItem(LS_KEY); if(saved&&(window.GUMROAD&&window.GUMROAD.permalink)){ const r=await verifyLicense(saved); if(r.ok) state.premium=true; } reflectPremium(); })();
</script>
